<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Centipede</title>
<style>
* { margin: 0; padding: 0; }
body { background: #000; overflow: hidden; cursor: pointer; }
canvas { display: block; margin: 0 auto; background: #1a0a2e; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = 800;
canvas.height = 600;

let gameState = 'title';
let score = 0;
let lives = 3;

const player = { x: 400, y: 550, width: 30, height: 20 };
let bullets = [];

const mushrooms = [];
for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 15; col++) {
        if (Math.random() > 0.3) {
            mushrooms.push({ x: col * 55 + 27, y: row * 60 + 40, hp: 3 });
        }
    }
}

let centipede = [];
function createCentipede() {
    centipede = [];
    for (let i = 0; i < 12; i++) {
        centipede.push({ x: 300 + i * 25, y: 50 });
    }
}

const keys = {};
document.addEventListener('keydown', (e) => { keys[e.key] = true; });
document.addEventListener('keyup', (e) => { keys[e.key] = false; });

canvas.addEventListener('click', () => {
    if (gameState === 'title') {
        startGame();
    } else if (gameState === 'playing') {
        bullets.push({ x: player.x, y: player.y });
    } else if (gameState === 'gameover') {
        startGame();
    }
});

function startGame() {
    gameState = 'playing';
    score = 0;
    lives = 3;
    bullets = [];
    createCentipede();
}

function update() {
    if (gameState !== 'playing') return;

    if (keys['ArrowLeft'] && player.x > 0) player.x -= 5;
    if (keys['ArrowRight'] && player.x < canvas.width - player.width) player.x += 5;

    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= 8;
        if (bullets[i].y < 0) bullets.splice(i, 1);
    }

    let moveDown = false;
    for (let i = 0; i < centipede.length; i++) {
        centipede[i].x += 2;
        if (centipede[i].x > canvas.width - 30 || centipede[i].x < 30) moveDown = true;
    }

    if (moveDown) {
        for (let i = 0; i < centipede.length; i++) {
            if (centipede[i].x > canvas.width - 30) centipede[i].x = canvas.width - 30;
            if (centipede[i].x < 30) centipede[i].x = 30;
            centipede[i].y += 20;
        }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = centipede.length - 1; j >= 0; j--) {
            const dist = Math.hypot(bullets[i].x - centipede[j].x, bullets[i].y - centipede[j].y);
            if (dist < 20) { bullets.splice(i, 1); centipede.splice(j, 1); score += 10; break; }
        }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = mushrooms.length - 1; j >= 0; j--) {
            const dist = Math.hypot(bullets[i].x - mushrooms[j].x, bullets[i].y - mushrooms[j].y);
            if (dist < 20) { bullets.splice(i, 1); mushrooms[j].hp--; if (mushrooms[j].hp <= 0) mushrooms.splice(j, 1); break; }
        }
    }

    for (let i = 0; i < centipede.length; i++) {
        const dist = Math.hypot(player.x - centipede[i].x, player.y - centipede[i].y);
        if (dist < 25) { lives--; if (lives <= 0) gameState = 'gameover'; else player.x = 400; }
    }

    if (centipede.length === 0) { createCentipede(); score += 100; }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'title') {
        ctx.fillStyle = '#fff';
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('CENTIPEDE', canvas.width / 2, 200);
        ctx.font = '24px Arial';
        ctx.fillText('Click to Start', canvas.width / 2, 300);
        return;
    }

    ctx.fillStyle = '#8b4513';
    for (let m of mushrooms) { ctx.beginPath(); ctx.arc(m.x, m.y, 15, 0, Math.PI * 2); ctx.fill(); }

    ctx.fillStyle = '#ff0000';
    for (let i = 0; i < centipede.length; i++) { ctx.beginPath(); ctx.arc(centipede[i].x, centipede[i].y, 12, 0, Math.PI * 2); ctx.fill(); }

    ctx.fillStyle = '#ffff00';
    for (let b of bullets) { ctx.fillRect(b.x - 2, b.y, 4, 10); }

    ctx.fillStyle = '#00ff00';
    ctx.fillRect(player.x - player.width / 2, player.y - player.height / 2, player.width, player.height);

    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 10, 30);
    ctx.fillText('Lives: ' + lives, 10, 60);

    if (gameState === 'gameover') {
        ctx.fillStyle = '#ff0000';
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
    }
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
</body>
</html>
