<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Centipede</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let score = 0, lives = 3, wave = 1;
let started = false;

const player = { x: c.width / 2, y: c.height - 60 };
const bullets = [];
const mushrooms = [];
const centipede = [];

// Init mushrooms in a grid
function initMushrooms() {
    mushrooms.length = 0;
    for (let r = 0; r < 6; r++) {
        for (let col = 0; col < c.width / 30; col++) {
            if (Math.random() > 0.25) {
                mushrooms.push({ x: col * 30 + 15, y: r * 28 + 40, hp: 4 });
            }
        }
    }
}

function initCentipede() {
    centipede.length = 0;
    const n = 12 + wave * 2;
    for (let i = 0; i < n; i++) {
        centipede.push({ x: c.width / 2 + (i - n/2) * 18, y: 30 });
    }
}

initMushrooms();
initCentipede();

// Input
const keys = {};
document.addEventListener('keydown', e => { if(['ArrowLeft','ArrowRight',' '].includes(e.key)) keys[e.key] = true; });
document.addEventListener('keyup', e => { if(['ArrowLeft','ArrowRight',' '].includes(e.key)) keys[e.key] = false; });

// Touch controls
let touchDir = 0;
c.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!started) { started = true; return; }
    const tx = e.touches[0].clientX;
    if (tx < c.width / 3) touchDir = -1;
    else if (tx > c.width * 2 / 3) touchDir = 1;
    else fire();
});
c.addEventListener('touchend', () => { touchDir = 0; });

// Mouse click to start
c.addEventListener('click', () => { if (!started) started = true; });

function fire() {
    bullets.push({ x: player.x, y: player.y - 10 });
}

function update() {
    // Player movement
    if (keys['ArrowLeft'] || touchDir === -1) player.x = Math.max(20, player.x - 6);
    if (keys['ArrowRight'] || touchDir === 1) player.x = Math.min(c.width - 20, player.x + 6);

    // Auto-fire on space
    if (keys[' ']) fire();

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= 8;
        if (bullets[i].y < -10) bullets.splice(i, 1);
    }

    // Move centipede
    let moveDown = false;
    for (const s of centipede) {
        s.x += 1.2;
        if (s.x > c.width - 10 || s.x < 10) moveDown = true;
    }
    if (moveDown) {
        for (const s of centipede) {
            s.x = Math.max(10, Math.min(c.width - 10, s.x));
            s.y += 8;
        }
    }

    // Bullet vs centipede collision
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        let hit = false;
        for (let j = centipede.length - 1; j >= 0; j--) {
            const s = centipede[j];
            if (Math.hypot(b.x - s.x, b.y - s.y) < 12) {
                bullets.splice(i, 1);
                centipede.splice(j, 1);
                score += 10;
                hit = true;
                break;
            }
        }
        if (hit) continue;

        // Bullet vs mushroom collision
        for (let j = mushrooms.length - 1; j >= 0; j--) {
            const m = mushrooms[j];
            if (Math.hypot(b.x - m.x, b.y - m.y) < 14) {
                bullets.splice(i, 1);
                mushrooms.splice(j, 1);
                score += 5;
                break;
            }
        }
    }

    // Player vs centipede collision
    for (const s of centipede) {
        if (Math.hypot(player.x - s.x, player.y - s.y) < 18) {
            lives--;
            if (lives <= 0) { alert('Game Over! Score: ' + score); location.reload(); }
            player.x = c.width / 2;
        }
    }

    // Wave clear
    if (centipede.length === 0) {
        wave++;
        initCentipede();
    }
}

function draw() {
    ctx.fillStyle = '#051a0a';
    ctx.fillRect(0, 0, c.width, c.height);

    // Draw mushrooms
    for (const m of mushrooms) {
        ctx.fillStyle = '#3a8030';
        ctx.fillRect(m.x - 6, m.y + 2, 12, 8);
        ctx.fillStyle = '#4aaa40';
        ctx.beginPath();
        ctx.arc(m.x, m.y - 2, 8, Math.PI, 0);
        ctx.fill();
    }

    // Draw centipede
    for (const s of centipede) {
        ctx.fillStyle = '#e84030';
        ctx.beginPath();
        ctx.arc(s.x, s.y, 7, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw bullets
    for (const b of bullets) {
        ctx.fillStyle = '#ff0';
        ctx.fillRect(b.x - 2, b.y - 5, 4, 10);
    }

    // Draw player
    ctx.fillStyle = '#0f0';
    ctx.fillRect(player.x - 12, player.y - 6, 24, 12);
    ctx.fillStyle = '#0a0';
    ctx.fillRect(player.x - 8, player.y + 6, 16, 4);

    // Draw UI
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.fillText('Score: ' + score, 10, 25);
    ctx.fillText('Lives: ' + lives, 10, 45);
    ctx.fillText('Wave: ' + wave, 10, 65);

    if (!started) {
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Tap or Click to Start', c.width / 2, c.height / 2);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
