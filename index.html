<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Centipede</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            overflow: hidden; 
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }
        .btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .btn:active {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div>LIVES: <span id="lives">3</span></div>
        <div>WAVE: <span id="wave">1</span></div>
    </div>
    <div id="controls">
        <div class="btn" id="left">←</div>
        <div class="btn" id="fire">●</div>
        <div class="btn" id="right">→</div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let score = 0;
        let lives = 3;
        let wave = 1;
        let gameRunning = false;
        
        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            width: 30,
            height: 20,
            speed: 5,
            bullets: []
        };
        
        // Mushrooms (grid-based)
        const mushroomGrid = [];
        const MUSHROOM_SIZE = 20;
        const GRID_COLS = Math.floor(canvas.width / (MUSHROOM_SIZE * 2));
        const GRID_ROWS = Math.floor((canvas.height - 100) / (MUSHROOM_SIZE * 2));
        
        // Initialize mushroom grid
        function initMushrooms() {
            for (let row = 0; row < GRID_ROWS; row++) {
                for (let col = 0; col < GRID_COLS; col++) {
                    if (Math.random() > 0.3) { // 70% chance of mushroom
                        mushroomGrid.push({
                            x: col * MUSHROOM_SIZE * 2 + MUSHROOM_SIZE,
                            y: row * MUSHROOM_SIZE * 2 + 50,
                            hp: 4,
                            maxHp: 4,
                            color: `hsl(${Math.random() * 60 + 120}, 70%, 50%)`
                        });
                    }
                }
            }
        }
        
        // Centipede segments - proper follow-the-leader movement
        let centipede = [];
        const CENTIPEDE_SPEED = 1;
        
        function initCentipede() {
            centipede = [];
            const segments = 10 + wave * 2;
            for (let i = 0; i < segments; i++) {
                centipede.push({
                    x: canvas.width / 2 + (i - segments/2) * 15,
                    y: 30,
                    size: i === 0 ? 12 : 10,
                    isHead: i === 0,
                    direction: 1
                });
            }
        }
        
        // Spiders, fleas, scorpions
        let spiders = [];
        let fleas = [];
        let scorpions = [];
        
        function spawnEnemy(type) {
            const enemy = {
                x: Math.random() * canvas.width,
                y: -20,
                type: type,
                speed: 1 + Math.random() * 2,
                direction: Math.random() > 0.5 ? 1 : -1
            };
            
            switch(type) {
                case 'spider':
                    enemy.hp = 3;
                    enemy.size = 15;
                    spiders.push(enemy);
                    break;
                case 'flea':
                    enemy.hp = 1;
                    enemy.size = 8;
                    fleas.push(enemy);
                    break;
                case 'scorpion':
                    enemy.hp = 5;
                    enemy.size = 18;
                    scorpions.push(enemy);
                    break;
            }
        }
        
        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Touch controls
        document.getElementById('left').addEventListener('touchstart', () => keys['ArrowLeft'] = true);
        document.getElementById('left').addEventListener('touchend', () => keys['ArrowLeft'] = false);
        document.getElementById('right').addEventListener('touchstart', () => keys['ArrowRight'] = true);
        document.getElementById('right').addEventListener('touchend', () => keys['ArrowRight'] = false);
        document.getElementById('fire').addEventListener('touchstart', () => fireBullet());
        
        // Mouse controls
        document.getElementById('left').addEventListener('mousedown', () => keys['ArrowLeft'] = true);
        document.getElementById('left').addEventListener('mouseup', () => keys['ArrowLeft'] = false);
        document.getElementById('right').addEventListener('mousedown', () => keys['ArrowRight'] = true);
        document.getElementById('right').addEventListener('mouseup', () => keys['ArrowRight'] = false);
        document.getElementById('fire').addEventListener('mousedown', () => fireBullet());
        
        function fireBullet() {
            if (!gameRunning) return;
            player.bullets.push({
                x: player.x,
                y: player.y - 10,
                speed: 8
            });
        }
        
        // Drawing functions with high-fidelity sprites
        function drawPlayer() {
            ctx.save();
            
            // Body
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(player.x - 15, player.y - 8, 30, 16);
            
            // Head
            ctx.fillStyle = '#ff6666';
            ctx.beginPath();
            ctx.arc(player.x, player.y - 8, 10, Math.PI, 0);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x - 5, player.y - 10, 3, 0, Math.PI * 2);
            ctx.arc(player.x + 5, player.y - 10, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Antennae
            ctx.strokeStyle = '#ff4444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(player.x - 8, player.y - 15);
            ctx.lineTo(player.x - 12, player.y - 20);
            ctx.moveTo(player.x + 8, player.y - 15);
            ctx.lineTo(player.x + 12, player.y - 20);
            ctx.stroke();
            
            // Legs
            ctx.strokeStyle = '#cc3333';
            ctx.lineWidth = 2;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(player.x + i * 8, player.y + 8);
                ctx.lineTo(player.x + i * 10, player.y + 15);
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function drawMushroom(m) {
            ctx.save();
            
            // Stem
            ctx.fillStyle = '#f5deb3';
            ctx.fillRect(m.x - 4, m.y + 5, 8, 10);
            
            // Cap
            const hpRatio = m.hp / m.maxHp;
            ctx.fillStyle = m.color;
            ctx.globalAlpha = 0.5 + hpRatio * 0.5;
            ctx.beginPath();
            ctx.arc(m.x, m.y, 12, Math.PI, 0);
            ctx.fill();
            
            // Spots
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.7;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(m.x - 6 + i * 6, m.y - 3, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Damage cracks
            if (m.hp < m.maxHp) {
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                for (let i = 0; i < m.maxHp - m.hp; i++) {
                    ctx.beginPath();
                    ctx.moveTo(m.x - 5 + i * 4, m.y);
                    ctx.lineTo(m.x - 3 + i * 4, m.y + 5);
                    ctx.stroke();
                }
            }
            
            ctx.restore();
        }
        
        function drawCentipedeSegment(seg) {
            ctx.save();
            
            if (seg.isHead) {
                // Head - larger, brighter
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(seg.x, seg.y, seg.size + 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(seg.x - 4, seg.y - 2, 3, 0, Math.PI * 2);
                ctx.arc(seg.x + 4, seg.y - 2, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Mandibles
                ctx.strokeStyle = '#cc0000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(seg.x - 6, seg.y + 5);
                ctx.lineTo(seg.x - 8, seg.y + 10);
                ctx.moveTo(seg.x + 6, seg.y + 5);
                ctx.lineTo(seg.x + 8, seg.y + 10);
                ctx.stroke();
            } else {
                // Body segments - alternating colors
                const color = seg.size % 2 === 0 ? '#ff6600' : '#cc3300';
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(seg.x, seg.y, seg.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Pattern
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.arc(seg.x - 2, seg.y - 2, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function drawEnemy(enemy) {
            ctx.save();
            
            switch(enemy.type) {
                case 'spider':
                    // Body
                    ctx.fillStyle = '#8b4513';
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, enemy.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Legs (8 legs)
                    ctx.strokeStyle = '#654321';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 4; i++) {
                        const angle = (i / 4) * Math.PI - Math.PI / 2;
                        ctx.beginPath();
                        ctx.moveTo(enemy.x, enemy.y);
                        ctx.lineTo(
                            enemy.x + Math.cos(angle) * enemy.size * 1.5,
                            enemy.y + Math.sin(angle) * enemy.size * 1.5
                        );
                        ctx.stroke();
                        
                        // Mirror legs
                        ctx.beginPath();
                        ctx.moveTo(enemy.x, enemy.y);
                        ctx.lineTo(
                            enemy.x + Math.cos(angle + Math.PI) * enemy.size * 1.5,
                            enemy.y + Math.sin(angle + Math.PI) * enemy.size * 1.5
                        );
                        ctx.stroke();
                    }
                    
                    // Eyes
                    ctx.fillStyle = '#ff0000';
                    for (let i = 0; i < 4; i++) {
                        ctx.beginPath();
                        ctx.arc(
                            enemy.x - 3 + i * 2,
                            enemy.y - 3,
                            1.5,
                            0, Math.PI * 2
                        );
                        ctx.fill();
                    }
                    break;
                    
                case 'flea':
                    // Body
                    ctx.fillStyle = '#4a3728';
                    ctx.beginPath();
                    ctx.ellipse(enemy.x, enemy.y, enemy.size, enemy.size * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Wings
                    ctx.fillStyle = 'rgba(200, 200, 200, 0.5)';
                    ctx.beginPath();
                    ctx.ellipse(enemy.x - 3, enemy.y - 5, 4, 6, -0.3, 0, Math.PI * 2);
                    ctx.ellipse(enemy.x + 3, enemy.y - 5, 4, 6, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Legs
                    ctx.strokeStyle = '#3a2718';
                    ctx.lineWidth = 1;
                    for (let i = -2; i <= 2; i++) {
                        ctx.beginPath();
                        ctx.moveTo(enemy.x + i * 3, enemy.y + 4);
                        ctx.lineTo(enemy.x + i * 2, enemy.y + 8);
                        ctx.stroke();
                    }
                    break;
                    
                case 'scorpion':
                    // Body
                    ctx.fillStyle = '#4b0082';
                    ctx.beginPath();
                    ctx.ellipse(enemy.x, enemy.y, enemy.size * 0.8, enemy.size * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Tail
                    ctx.strokeStyle = '#4b0082';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(enemy.x, enemy.y - 5);
                    ctx.quadraticCurveTo(
                        enemy.x + enemy.direction * 10,
                        enemy.y - 15,
                        enemy.x + enemy.direction * 15,
                        enemy.y - 8
                    );
                    ctx.stroke();
                    
                    // Stinger
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(
                        enemy.x + enemy.direction * 15,
                        enemy.y - 8,
                        3, 0, Math.PI * 2
                    );
                    ctx.fill();
                    
                    // Pincers
                    ctx.strokeStyle = '#4b0082';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(enemy.x - enemy.size * 0.5, enemy.y);
                    ctx.lineTo(enemy.x - enemy.size * 0.8, enemy.y - 5);
                    ctx.moveTo(enemy.x + enemy.size * 0.5, enemy.y);
                    ctx.lineTo(enemy.x + enemy.size * 0.8, enemy.y - 5);
                    ctx.stroke();
                    
                    // Eyes
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(enemy.x - 3, enemy.y - 2, 2, 0, Math.PI * 2);
                    ctx.arc(enemy.x + 3, enemy.y - 2, 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
            }
            
            ctx.restore();
        }
        
        function drawBullet(bullet) {
            ctx.save();
            
            // Bullet trail
            const gradient = ctx.createLinearGradient(bullet.x, bullet.y, bullet.x, bullet.y + 15);
            gradient.addColorStop(0, '#ffff00');
            gradient.addColorStop(1, 'rgba(255, 255, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(bullet.x - 2, bullet.y, 4, 15);
            
            // Bullet head
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        // Game loop
        function update() {
            if (!gameRunning) return;
            
            // Player movement
            if (keys['ArrowLeft'] && player.x > 20) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - 20) {
                player.x += player.speed;
            }
            
            // Update bullets
            for (let i = player.bullets.length - 1; i >= 0; i--) {
                const bullet = player.bullets[i];
                bullet.y -= bullet.speed;
                
                // Remove off-screen bullets
                if (bullet.y < 0) {
                    player.bullets.splice(i, 1);
                    continue;
                }
                
                // Check bullet vs centipede
                for (let j = centipede.length - 1; j >= 0; j--) {
                    const seg = centipede[j];
                    const dist = Math.hypot(bullet.x - seg.x, bullet.y - seg.y);
                    if (dist < seg.size + 5) {
                        // Hit!
                        player.bullets.splice(i, 1);
                        
                        if (seg.isHead) {
                            score += 100;
                            centipede.splice(j, 1);
                        } else {
                            score += 10;
                            seg.hp = (seg.hp || 4) - 1;
                            if (seg.hp <= 0) {
                                centipede.splice(j, 1);
                            } else {
                                // Split centipede
                                const newSeg = {
                                    x: seg.x,
                                    y: seg.y + 15,
                                    size: seg.size,
                                    isHead: false,
                                    direction: -seg.direction || 1
                                };
                                centipede.splice(j + 1, 0, newSeg);
                            }
                        }
                        
                        updateUI();
                        break;
                    }
                }
                
                // Check bullet vs mushrooms
                for (let j = mushroomGrid.length - 1; j >= 0; j--) {
                    const mush = mushroomGrid[j];
                    const dist = Math.hypot(bullet.x - mush.x, bullet.y - mush.y);
                    if (dist < 15) {
                        player.bullets.splice(i, 1);
                        mush.hp--;
                        if (mush.hp <= 0) {
                            mushroomGrid.splice(j, 1);
                        }
                        break;
                    }
                }
                
                // Check bullet vs enemies
                for (let j = spiders.length - 1; j >= 0; j--) {
                    const spider = spiders[j];
                    const dist = Math.hypot(bullet.x - spider.x, bullet.y - spider.y);
                    if (dist < spider.size + 5) {
                        player.bullets.splice(i, 1);
                        spider.hp--;
                        if (spider.hp <= 0) {
                            spiders.splice(j, 1);
                            score += 300;
                        }
                        updateUI();
                        break;
                    }
                }
                
                for (let j = fleas.length - 1; j >= 0; j--) {
                    const flea = fleas[j];
                    const dist = Math.hypot(bullet.x - flea.x, bullet.y - flea.y);
                    if (dist < flea.size + 5) {
                        player.bullets.splice(i, 1);
                        fleas.splice(j, 1);
                        score += 200;
                        updateUI();
                        break;
                    }
                }
                
                for (let j = scorpions.length - 1; j >= 0; j--) {
                    const scorpion = scorpions[j];
                    const dist = Math.hypot(bullet.x - scorpion.x, bullet.y - scorpion.y);
                    if (dist < scorpion.size + 5) {
                        player.bullets.splice(i, 1);
                        scorpion.hp--;
                        if (scorpion.hp <= 0) {
                            scorpions.splice(j, 1);
                            score += 500;
                        }
                        updateUI();
                        break;
                    }
                }
            }
            
            // Update centipede
            let moveDown = false;
            for (const seg of centipede) {
                if (seg.isHead) {
                    seg.x += CENTIPEDE_SPEED * seg.direction;
                    
                    // Reverse at edges
                    if (seg.x > canvas.width - 20 || seg.x < 20) {
                        seg.direction *= -1;
                        moveDown = true;
                    }
                } else {
                    // Follow previous segment
                    const prevSeg = centipede[centipede.indexOf(seg) - 1];
                    if (prevSeg) {
                        seg.x += (prevSeg.x - seg.x) * 0.3;
                        seg.y += (prevSeg.y - seg.y) * 0.3;
                    }
                }
            }
            
            if (moveDown) {
                for (const seg of centipede) {
                    seg.y += 10;
                }
            }
            
            // Check centipede vs player
            for (const seg of centipede) {
                const dist = Math.hypot(player.x - seg.x, player.y - seg.y);
                if (dist < 20) {
                    lives--;
                    updateUI();
                    if (lives <= 0) {
                        gameRunning = false;
                    } else {
                        // Reset player position
                        player.x = canvas.width / 2;
                    }
                }
            }
            
            // Update enemies
            for (let i = spiders.length - 1; i >= 0; i--) {
                const spider = spiders[i];
                spider.x += spider.speed * spider.direction;
                spider.y += 0.5;
                
                if (spider.x < 0 || spider.x > canvas.width) {
                    spider.direction *= -1;
                }
                
                if (spider.y > canvas.height) {
                    spiders.splice(i, 1);
                }
                
                // Check collision with player
                const dist = Math.hypot(player.x - spider.x, player.y - spider.y);
                if (dist < 20) {
                    lives--;
                    updateUI();
                    if (lives <= 0) gameRunning = false;
                }
            }
            
            for (let i = fleas.length - 1; i >= 0; i--) {
                const flea = fleas[i];
                flea.x += Math.sin(flea.y * 0.1) * 2;
                flea.y += flea.speed;
                
                if (flea.y > canvas.height) {
                    fleas.splice(i, 1);
                }
                
                const dist = Math.hypot(player.x - flea.x, player.y - flea.y);
                if (dist < 15) {
                    lives--;
                    updateUI();
                    if (lives <= 0) gameRunning = false;
                }
            }
            
            for (let i = scorpions.length - 1; i >= 0; i--) {
                const scorpion = scorpions[i];
                scorpion.x += scorpion.speed * scorpion.direction;
                scorpion.y += 0.3;
                
                if (scorpion.x < 0 || scorpion.x > canvas.width) {
                    scorpion.direction *= -1;
                }
                
                if (scorpion.y > canvas.height) {
                    scorpions.splice(i, 1);
                }
                
                const dist = Math.hypot(player.x - scorpion.x, player.y - scorpion.y);
                if (dist < 25) {
                    lives--;
                    updateUI();
                    if (lives <= 0) gameRunning = false;
                }
            }
            
            // Spawn enemies periodically
            if (Math.random() < 0.01) spawnEnemy('spider');
            if (Math.random() < 0.02) spawnEnemy('flea');
            if (Math.random() < 0.005 && wave > 2) spawnEnemy('scorpion');
            
            // Check wave completion
            if (centipede.length === 0 && spiders.length === 0 && fleas.length === 0 && scorpions.length === 0) {
                wave++;
                initCentipede();
                updateUI();
            }
        }
        
        function draw() {
            // Clear canvas with dark background
            ctx.fillStyle = '#0a0a1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid lines (subtle)
            ctx.strokeStyle = 'rgba(100, 100, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Draw mushrooms
            for (const mush of mushroomGrid) {
                drawMushroom(mush);
            }
            
            // Draw centipede
            for (const seg of centipede) {
                drawCentipedeSegment(seg);
            }
            
            // Draw enemies
            for (const spider of spiders) drawEnemy(spider);
            for (const flea of fleas) drawEnemy(flea);
            for (const scorpion of scorpions) drawEnemy(scorpion);
            
            // Draw bullets
            for (const bullet of player.bullets) {
                drawBullet(bullet);
            }
            
            // Draw player
            if (gameRunning || lives > 0) {
                drawPlayer();
            }
            
            // Draw game over screen
            if (!gameRunning && lives <= 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 50);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = '24px Arial';
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText(`Waves Survived: ${wave}`, canvas.width / 2, canvas.height / 2 + 40);
                
                ctx.fillStyle = '#ffff00';
                ctx.font = '18px Arial';
                ctx.fillText('Tap to Restart', canvas.width / 2, canvas.height / 2 + 80);
            }
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('wave').textContent = wave;
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Initialize game
        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            initMushrooms();
            initCentipede();
            updateUI();
            
            // Start game on first tap/click
            const startGame = () => {
                if (!gameRunning) {
                    gameRunning = true;
                    score = 0;
                    lives = 3;
                    wave = 1;
                    player.x = canvas.width / 2;
                    initMushrooms();
                    initCentipede();
                    updateUI();
                }
            };
            
            canvas.addEventListener('click', startGame);
            canvas.addEventListener('touchstart', startGame);
            
            gameLoop();
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Start game
        init();
    </script>
</body>
</html>
