<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cenitpede</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#111;color:#eee;font-family:monospace}
body{overflow:hidden;-webkit-tap-highlight-color:transparent}
#wr{position:relative;width:100vw;height:100dvh;display:flex;flex-direction:column;background:#000;padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{display:block;background:#1a4927}
#hud{padding:calc(8px+env(safe-area-inset-top,0px)) calc(8px+env(safe-area-inset-right,0px)) 60px calc(8px+env(safe-area-inset-left,0px));background:rgba(0,0,0,.5);display:flex;justify-content:space-between;font-size:13px;z-index:3}
#touch{position:absolute;left:calc(4px+env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);z-index:3;display:none}
@media(hover:hover){#touch{display:none!important}}
.joystickArea{position:absolute;left:calc(8px+env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);width:140px;height:140px;border-radius:50%;background:rgba(20,30,60,.35);border:2px solid rgba(100,180,255,.25);touch-action:none;cursor:none}
.joystickArea::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:rgba(30,60,120,.4);border:2px solid rgba(80,160,255,.3)}
.joystickThumb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:rgba(100,180,255,.65);border:2px solid rgba(180,220,255,.7);cursor:pointer;transition:box-shadow .15s}
.joystickThumb:active{background:rgba(140,220,255,.85);box-shadow:0 0 16px rgba(60,160,255,.5)}
.fireBtn{position:absolute;width:72px;height:72px;top:calc(50%-36px);right:-80px;background:rgba(220,40,40,.35);border:2px solid rgba(255,70,70,.3);color:white;font-size:16px;display:flex;align-items:center;justify-content:center;border-radius:8px;-webkit-appearance:none;cursor:pointer;touch-action:none}
.fireBtn:active{background:rgba(240,60,60,.55);box-shadow:inset 0 0 12px rgba(255,70,70,.3)}
#ovr{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:4;color:#fff;font-size:20px;text-align:center;padding:30px}
#ovr h1{font-size:40px;margin-bottom:16px;color:#f99;letter-spacing:6px;animation:arcadePulse 2.8s ease-in-out infinite}
@keyframes arcadePulse{
  0%,100%{color:#f99;text-shadow:0 0 18px rgba(255,100,0,.3),0 0 4px rgba(255,100,0,.1)}
  50%{color:#ff6;text-shadow:0 0 30px rgba(255,100,0,.5),0 0 8px rgba(255,100,0,.2)}
}
#ovr p{margin:8px 0;font-size:15px;line-height:1.6}
@keyframes promptBlink{
  0%   {opacity:.95 }
  50%  {opacity:.4 }
  100% {opacity:.95}
}
#start-prompt{animation:promptBlink 2s steps(2,start) infinite}
#crt{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
#crt::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px);z-index:6}
#crt::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.22) 100%);z-index:7}
</style>
</head>
<body>
<div id="wr">
<canvas id="cvs" width="320" height="240"></canvas><div id="crt"></div>
<div id="hud"><span>SCORE <b id="sc">0</b></span><span>LIVES <b id="lv">3</b></span><span>WAVE <b id="wg">1</b></span><span>HIGH <b id="hs">0</b></span></div>
<div id="touch">
  <div class="dpad">
    <div class="joystickArea"><div class="joystickThumb"></div></div>
    <button class="fireBtn" id="fb">FIRE</button>
</div>
</div>
<div id="ovr"><h1>CENITPEDE</h1><p id="start-prompt">TAP SCREEN TO START</p><p id="ovrMsg" style="font-size:15px;color:#ff9;margin-top:12px;display:none"></p><p style="font-size:12px;color:#aaa;margin-top:18px;">ARROWS MOVE &middot; Z or SPACE to FIRE</p></div>

<script>
(function(){
"use strict";
var canvas = document.getElementById("cvs");
var ctx = canvas.getContext("2d");
var W = 320, H = 240, DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = W * DPR;
canvas.height = H * DPR;
canvas.style.width  = W + "px";
canvas.style.height = H + "px";
ctx.scale(DPR, DPR);

// --- refs ---
var hudSc   = document.getElementById("sc");
var hudLv   = document.getElementById("lv");
var hudWg   = document.getElementById("wg");
var ovrEl   = document.getElementById("ovr");
var fbBtn   = document.getElementById("fb");

// --- game state ---
var player  = { x:160, y:H-24, w:28, h:10, invT:0 };
var bullets = [];
var mush    = [];
var centi   = [];
var fleas   = [];
var spiders = [];
var scorpions = [];
var spiderSpawnTimer = 0;
var fleaSpawnTimer = 0;
var scorpionSpawnTimer = 0;
var SPIDER_SPAWN_INTERVAL = 600; // frames (~9.6s at 60fps)

// --- shot cooldown state (authentic Centipede: one shot, then wait before next) ---
var SHOT_COOLDOWN = 350;    // ms between shots for balance
var lastShotTime=0;         // timestamp of last fireBullet() call
var SPIDER_HUNT_RANGE = 150;
var SPIDER_SPEED = 2.2;
var FLEA_SPAWN_INTERVAL = 900;
var FLEA_SPEED = 3.5;
var FLEA_SCORE = 200;
var FLEA_MAX = 2;
var SCORPION_SPAWN_INTERVAL = 1200; // frames (~19.2s at 60fps)
var SCORPION_SPEED = 1.8;
var SCORPION_SCORE = 1000;
// --- lower third of playfield: upper bound of the mushroom-free player zone ---
var PLAYER_ZONE_TOP = Math.floor(H * 0.80); // bottom 20% player zone (authentic Centipede)

var score   = 0;
var lives   = 3;
var nextExtraLife = 12000;
var wave    = 1;
var gameOver= false;
try{var hs=parseInt(localStorage.getItem("cenitpede_hs")||"0",10);if(isNaN(hs))hs=0}catch(e){hs=0}var highScore=hs;
var keys    = {};
var running = false;

// --- particle FX state (bounded, capped at 80) ---
var fxPars   = [];       // {x,y,vx,vy,life,color}
var FX_MAX   = 80;
var FX_LIFE  = 24;       // frames before a particle dies

// --- parallax depth layer (ambient playfield depth, ~40 pre-generated dots) ---
var bgStars=[];var BG_STAR_COUNT=40;
(function(){for(var i=0;i<BG_STAR_COUNT;i++){bgStars.push({x:Math.random()*W,y:Math.random()*H,layer:Math.floor(Math.random()*3),phase:Math.random()*Math.PI*2});}})();

// --- screen-flash state (bounded cabinet feedback) ---
var flashT   = 0;        // remaining frame count of current flash
var flashColor=null;     // "#fff" hit / "#f44" damage
var FLASH_CAP=6;         // max flash duration in frames

function triggerFlash(color){
  if(!flashColor){
    flashT=1; flashColor=color;
  } else if (flashColor!==color && flashT<FLASH_CAP){
    flashT++; flashColor=color;
  }
}

// --- decrement flash duration once per update, clear when done ---
function updateFlash(){
  if(flashColor&&flashT>0){flashT--;}
  if(!flashT){flashColor=null;}
}

// --- spawn burst of particles at (x,y) ---
function spawnBurst(x, y, color, count){
  for(var i=0;i<count;i++){
    var a=(i/FX_MAX)*Math.PI*2;
    fxPars.push({x:x+5*Math.cos(a),y:y+5*Math.sin(a),vx:5*Math.cos(a)+Math.random()*3-1.5,vy:5*Math.sin(a)+Math.random()*3-1.5,life:FX_LIFE,color});
  }
}

// --- update FX particles each frame; cap at 80; remove dead ---
function updateFx(){
  for(var i=fxPars.length-1;i>=0;i--){
    var p = fxPars[i];
    if(!p) continue;
    p.x += p.vx; p.y += p.vy; p.life--;
    // cap enforcement: oldest particles die first when over limit
    if(fxPars.length > FX_MAX){
      fxPars.splice(0,fxPars.length-FX_MAX);
    }
  }
}

// --- draw FX particles ---
function drawFx(){
  for(var p of fxPars){
    ctx.globalAlpha = Math.max(0,p.life/FX_LIFE);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha = 1;
}

// --- draw screen flash overlay near end of drawGame() ---
function drawFlash(){
  if(flashT<=0) return;
  ctx.save();
  var r=flashColor==="#fff"?"rgba(255,255,255,"+(flashT/FLASH_CAP)+")":"rgba(255,68,68,"+(flashT/FLASH_CAP)+")";
  ctx.fillStyle=r;ctx.fillRect(0,0,W,H);
  ctx.restore();
}

// --- procedural pixel-art sprite functions with neon glow ---
function drawMushroomSprite(x,y,w,h,hp,poisoned){
  var f=(hp||4)/4;
  var r=poisoned?Math.floor(0x83*f):Math.floor(0x6B*f);
  var g=poisoned?Math.floor(0x3a*f):Math.floor(0x22+0x99*(1-f));
  var b=poisoned?170:Math.floor(0x02+0x60*(1-f));
  // neon glow shadow beneath mushroom
  ctx.globalAlpha=.35;ctx.fillStyle="rgba("+r+", "+g+", "+b+", .4)";ctx.fillRect(x-w/2,y-8,w,h);
  ctx.globalAlpha=1;
  ctx.fillStyle="rgb("+r+","+g+","+b+")";
  ctx.fillRect(x-w/2,y-4,w,h);
  // brighter cap highlight for neon feel
  ctx.globalAlpha=.75;ctx.fillStyle="rgba(200,220,180,.35)";ctx.beginPath();ctx.arc(x+2,y-6,w*.4,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle="rgb("+Math.floor(r*.7)+","+Math.floor(g*.7)+","+Math.floor(b*.7)+")";
  ctx.beginPath();ctx.arc(x,y-2,w/2,Math.PI,true);ctx.fill();
  var spots=Math.max(0,hp-1);
  ctx.fillStyle=poisoned?"#b6f":"#c84";
  for(var si=0;si<spots;si++){
    var sx=x-w/4+(si%2)*w/2, sy2=y-4+h*(si+1)/(spots+2);
    ctx.fillRect(sx,sy2,2,2);
  }
  ctx.strokeStyle=poisoned?"#83c":"#472";ctx.lineWidth=.5;
  ctx.strokeRect(x-w/2,y-4,w,h);
}

function drawCentipedeSprite(x,y,sw,sh,isHead,dirX){
  // neon glow for segment body
  ctx.globalAlpha=.4;ctx.fillStyle=isHead?"rgba(255,70,50,.6)":"rgba(200,80,30,.5)";ctx.fillRect(x-sw/2,y-sh/2+1,sw-2,sh-2);
  ctx.globalAlpha=1;
  ctx.fillStyle=isHead?"#f44":"#b33";
  ctx.fillRect(x-sw/2,y-sh/2,sw,sh);
  ctx.fillStyle=isHead?"#d22":"#822";
  ctx.fillRect(x-sw/2+1,y-sh/2+1,sw-2,sh-2);
  // brighter center highlight for neon feel
  ctx.fillStyle=isHead?"rgba(255,100,60,.25)":"rgba(180,70,30,.2)";ctx.fillRect(x-sw/4,y-sh/4,sw/2,sh/2);
  ctx.strokeStyle=isHead?"#faa":"#600";ctx.lineWidth=.5;
  ctx.strokeRect(x-sw/2,y-sh/2,sw,sh);
  if(isHead){
    var mDir=dirX||1;
    ctx.strokeStyle="#f55";ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(x+mDir*sw/2,y-sh/4);ctx.lineTo(x+mDir*(sw/2+3),y-sh/2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+mDir*sw/2,y+sh/4);ctx.lineTo(x+mDir*(sw/2+3),y+sh/2);ctx.stroke();
  }
}

function drawSpiderSprite(x,y,sw,sh,dirX){
  // neon glow shadow for spider
  ctx.globalAlpha=.4;ctx.fillStyle="rgba(60,30,10,.5)";ctx.fillRect(x-sw/2-1,y-sh/2-1,sw+2,sh+2);
  ctx.globalAlpha=1;
  ctx.fillStyle="#4a2";ctx.fillRect(x-sw/2,y-sh/2,sw,sh);
  ctx.fillStyle="#5c3";ctx.fillRect(x-sw/2+1,y-sh/2+1,sw-2,sh-2);
  ctx.strokeStyle="#7c5";ctx.lineWidth=.6;
  var lo=dirX>0?-2:2;
  for(var li=0;li<4;li++){
    var lx=x-sw/2+3+li*3;
    ctx.beginPath();ctx.moveTo(lx,y-1);ctx.lineTo(lx+lo,y-5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(lx,y+1);ctx.lineTo(lx+lo,y+5);ctx.stroke();
  }
  ctx.fillStyle="#f00";ctx.fillRect(x-3,y-2,2,2);ctx.fillRect(x+1,y-2,2,2);
}

function drawFleaSprite(x,y,sw,sh){
  ctx.globalAlpha=.5;ctx.fillStyle="rgba(80,70,40,.5)";ctx.fillRect(x-sw/2-1,y-sh/2-1,sw+2,sh+2);
  ctx.globalAlpha=1;
  ctx.fillStyle="#654";ctx.fillRect(x-sw/2,y-sh/2,sw,sh);
  ctx.fillStyle="#784";ctx.fillRect(x-sw/2+1,y-sh/2+1,sw-2,sh-2);
  ctx.strokeStyle="#432";ctx.lineWidth=.6;
  for(var fi=0;fi<3;fi++){
    var fx=x-sw/2+2+fi*4;
    ctx.beginPath();ctx.moveTo(fx,y-1);ctx.lineTo(fx+.8,y-5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fx,y+1);ctx.lineTo(fx+.8,y+5);ctx.stroke();
  }
  ctx.fillStyle="#321";ctx.fillRect(x-2,y-1,1,1);ctx.fillRect(x+1,y-1,1,1);
}

function drawScorpionSprite(sx,sy,dirX){
  ctx.fillStyle="#639";ctx.fillRect(sx-8,sy-5,16,10);
  ctx.fillStyle="#74a";ctx.fillRect(sx-12,sy-3,4,6);
  ctx.strokeStyle="#96c";ctx.lineWidth=.6;
  for(var sli=0;sli<4;sli++){
    var slx=sx-5+sli*4;
    ctx.beginPath();ctx.moveTo(slx,sy-1);ctx.lineTo(slx+2,sy-6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(slx,sy+1);ctx.lineTo(slx+2,sy+6);ctx.stroke();
  }
  var pd=dirX>0?-1:1;
  ctx.strokeStyle="#a8f";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(sx+pd*7,sy-4);ctx.lineTo(sx+pd*13,sy-7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+pd*7,sy+4);ctx.lineTo(sx+pd*13,sy+7);ctx.stroke();
  ctx.strokeStyle="#b9f";ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(sx-dirX*8,sy);ctx.quadraticCurveTo(sx-dirX*14,sy-6,sx-dirX*16,sy-2);ctx.stroke();
  // neon stinger glow for scorpion
  ctx.globalAlpha=.35;ctx.fillStyle="rgba(200,180,255,.4)";ctx.beginPath();ctx.arc(sx+pd*7,sy-4,3*Math.PI/6,Math.PI/3,Math.PI*2-Math.PI/3);ctx.fill();
  ctx.globalAlpha=1;
}

function drawPlayerSprite(px,py,invT){
  var al=invT>0?(Math.floor(invT/150)%2===0?.3:1):1;
  ctx.globalAlpha=al;
  // neon glow ring around player for depth
  ctx.globalAlpha=.2;ctx.fillStyle="rgba(60,180,255,.4)";ctx.fillRect(px-16,py-4,32,16);
  ctx.globalAlpha=1;
  var flk=Math.random();
  // brighter neon red for player body
  ctx.fillStyle="#f42";ctx.fillRect(px-3,py+8,2,2+flk*3);
  ctx.fillStyle="#fc4";ctx.fillRect(px+1,py+8,2,2+flk*2);
  ctx.fillStyle="#fe6";ctx.fillRect(px-1,py+9,2,1+flk);
  // brighter cyan head with neon border
  ctx.fillStyle="#3af";ctx.fillRect(px-14,py,28,8);
  ctx.fillStyle="#0cd";ctx.fillRect(px-14,py,28,2);
  ctx.strokeStyle="#9cf";ctx.lineWidth=1.5;ctx.shadowColor="rgba(60,200,255,.3)";ctx.shadowBlur=3;ctx.strokeRect(px-14,py,28,8);ctx.shadowColor="none";ctx.shadowBlur=0;
  ctx.fillStyle="#5cf";ctx.fillRect(px-12,py+1,4,2);ctx.fillRect(px+8,py+1,4,2);
  ctx.fillStyle="#6df";ctx.fillRect(px-10,py+1,2,2);ctx.fillRect(px+10,py+1,2,2);
  // neon eyes glow
  ctx.globalAlpha=.5;ctx.fillStyle="rgba(100,240,255,.7)";ctx.beginPath();ctx.arc(px-6,py+3.5,1.5,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(px+6,py+3.5,1.5,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}

// --- CRT overlay handled by CSS #crt div (::before scanlines + ::after vignette) ---

// --- parallax depth layer (subtle ambient dots for playfield depth) ---
function drawBgDepth(){
  var t=performance.now()/1000;
  for(var i=0;i<bgStars.length;i++){
    var s=bgStars[i];
    var alpha,size,speed;
    if(s.layer===0){alpha=0.035;size=1;speed=0.3;}
    else if(s.layer===1){alpha=0.06;size=1.5;speed=0.6;}
    else{alpha=0.09;size=2;speed=1.0;}
    var pulse=alpha*(0.5+0.5*Math.sin(t*0.7+s.phase));
    var ox=(s.x+Math.sin(t*0.18+s.phase)*speed*4)%W;
    var oy=(s.y+Math.cos(t*0.12+s.phase)*speed*3)%H;
    if(ox<0)ox+=W;if(oy<0)oy+=H;
    ctx.fillStyle="rgba(120,230,120,"+pulse+")";
    ctx.fillRect(ox,oy,size,size);
  }
}

// --- score popup system ---
var popups=[];
function spawnPopup(x,y,text,color){popups.push({x:x,y:y,text:text,color:color||"#ff0",life:40,maxLife:40});}
function updatePopups(){for(var i=popups.length-1;i>=0;i--){popups[i].y-=.6;popups[i].life--;if(popups[i].life<=0)popups.splice(i,1);}}
function drawPopups(){for(var p of popups){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.font="bold 7px monospace";ctx.textAlign="center";ctx.fillText(p.text,p.x,p.y);}ctx.globalAlpha=1;}

// --- attract mode screen (animated background only; text rendered by HTML overlay) ---
function drawAttract(){
  ctx.fillStyle="#082812";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#0d4a22";ctx.fillRect(0,0,W,3);ctx.fillRect(0,H-3,W,3);
  drawBgDepth();
}

// --- wire FX into collision events below this line ---
// (bullet-hit, player-damage) triggered by updateFx calls inside loop() and drawGame()

// --- wave management ---
var centiSpawned = 0;       // segments spawned this wave
var centiTarget  = 0;       // total segments to spawn for current wave

// --- WAVE banner state (60-frame centered banner on canvas) ---
var waveBannerT = 0;        // frames remaining for the WAVE banner display

// --- grid config for mushrooms (8 cols × 5 rows, cell=40×24) ---
var MUSH_COLS = 8, MUSH_ROWS = 5;
var MUSH_CW = 40, MUSH_CH = 24;
var MUSH_OFF_X = 20, MUSH_OFF_Y = 16;

// --- poison state constants ---
var POISON_DMG = 3;       // damage per tick to centipede segments
var POISON_TICK = 500;    // ms between poison ticks
var POISON_LIFE = 4000;   // ms a poisoned mushroom stays active

// --- mushroom regen after player death (authentic: one per empty row) ---
function regenMushrooms(){
  for(var r=0;r<MUSH_ROWS;r++){
    var hasMush=false;
    for(var i=0;i<mush.length;i++){ if(mush[i].gR===r){hasMush=true;break;} }
    if(!hasMush){
      // find a random free column in this row
      var freeCols=[];
      for(var c2=0;c2<MUSH_COLS;c2++){
        var occ=false;
        for(var i2=0;i2<mush.length;i2++){ if(mush[i2].gR===r&&mush[i2].gC===c2){occ=true;break;} }
        if(!occ) freeCols.push(c2);
      }
      if(freeCols.length>0){
        var col=freeCols[Math.floor(Math.random()*freeCols.length)];
        mush.push({x:MUSH_OFF_X+col*MUSH_CW,y:MUSH_OFF_Y+r*MUSH_CH,w:18,h:14,stemH:0,gR:r,gC:col,poisoned:false,pTimer:0,hp:4});
      }
    }
  }
}

// --- helpers ---
function rnd(a,b){return a+Math.random()*(b-a)}
function rectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y }

// --- input: keyboard (arrows + WASD) ---
(function(){
  var keySet = ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyW","KeyA","KeyS","KeyD"];
  document.addEventListener("keydown",function(e){if(keySet.indexOf(e.key)>=0){e.preventDefault();keys[e.key]=true;}});
  document.addEventListener("keyup",function(e){if(keySet.indexOf(e.key)>=0){keys[e.key]=false;}});
})();window.addEventListener("blur",function(){for(var k in keys)delete keys[k];});

// --- input: virtual joystick (left thumb) for left/right movement + fire button ---

// --- apply poison to centipede segments near poisoned mushrooms ---
function tickPoison(dt){
  for(var i=mush.length-1;i>=0;i--){
    var m=mush[i]; if(!m.poisoned) continue;
    var hpFrac=(m.hp||4)/4;
    var poisonLife = POISON_LIFE * hpFrac;
    m.pTimer += dt;
    if(m.pTimer >= poisonLife){ m.poisoned=false; m.pTimer=0; }
    // damage every centipede segment within proximity of the mushroom
    for(var j=centi.length-1;j>=0;j--){
      var c=centi[j]; if(!c||!c.segments[0]) continue;
      for(var k=c.segments.length-1;k>=0;k--){
        var s=c.segments[k];
        var dx=s.x-m.x, dy=s.y-m.y;
        var range = MUSH_CW * (0.5 + hpFrac*0.5);
        if(Math.abs(dx)<range && Math.abs(dy) < MUSH_CH*hpFrac){
          s.w = Math.max(4, s.w - POISON_DMG*hpFrac);
          s.h = Math.max(3, s.h - POISON_DMG/2*hpFrac);
        }
      }
    }
  }
}

function spawnMush(){
  for(var r=0;r<MUSH_ROWS;r++){
    for(var c2=0;c2<MUSH_COLS;c2++){
      var occupied=false;
      for(var i=0;i<mush.length;i++){
        if(mush[i].gR===r&&mush[i].gC===c2){occupied=true;break}
      }
      if(!occupied){
        mush.push({x:MUSH_OFF_X+c2*MUSH_CW,y:MUSH_OFF_Y+r*MUSH_CH,w:18,h:14,stemH:0,gR:r,gC:c2,poisoned:false,pTimer:0,hp:4});
        return; // one mushroom per frame only when a slot is empty
      }
    }
  }
}

// --- fixed-timestep loop ---
var lastT=performance.now(), acc=0, TARGET=16, visPaused=false;
function loop(){
  requestAnimationFrame(loop);
  if(visPaused) return;
  if(!running){drawAttract();return;}
  var now=performance.now(); acc+=now-lastT; lastT=now;
  while(acc>TARGET){update(TARGET); acc-=TARGET;}
  drawGame();
}
loop();
// --- pause/resume on document visibility changes (clears stale input+audio state) ---
(function(){document.addEventListener("visibilitychange",function(){if(document.hidden){visPaused=true;Object.keys(keys).forEach(function(k){keys[k]=false;});}else{visPaused=false;lastT=performance.now();acc=0;}});})();
// --- update ---
function update(dt){
  // player movement + invincibility timer (diagonal-normalized)
  var mx=0, my=0;
  if(keys.ArrowLeft||keys.KeyA)  mx-=1;
  if(keys.ArrowRight||keys.KeyD) mx+=1;
  if(keys.ArrowUp||keys.KeyW)    my-=1;
  if(keys.ArrowDown||keys.KeyS)  my+=1;
  var mLen=Math.sqrt(mx*mx+my*my);
  if(mLen>1){mx/=mLen;my/=mLen;}
  var spd=4;
  player.x=Math.max(2,Math.min(W-2,player.x+mx*spd));
  player.y=Math.max(PLAYER_ZONE_TOP,Math.min(H-8,player.y+my*spd));
  if(player.invT > 0){ player.invT -= 16; }
  updateFlash();

  // decrement WAVE banner once per frame; auto-clear when done
  if(waveBannerT > 0){ waveBannerT--; } else { waveBannerT=0; }

  // bullets move up (poisoned bullets travel slower but don't destroy mushrooms)
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i]; b.x+=b.dx; b.y+=b.dy;
    if(b.poisoned){ b.pTimer = (b.pTimer||0) + 16; }
    if(b.y<8 || b.x<-8 || b.x>W+8 || (b.poisoned && b.pTimer>POISON_LIFE)) bullets.splice(i,1);
  }

        m.hp = (m.hp || 4) - 1;

        } else {
          m.w = 18 * (m.hp / 4);
          m.h = 14 * (m.hp / 4);
        }

        break; // one bullet hit per mushroom iteration max
      }
    }
    // player hits mushroom → safe: no life loss, just push player back

      var dx=player.x-m.x, dy=player.y-m.y;

              }
            }

    // player vs centipede segments -> lose life (any segment, with invincibility frames)

          playSfx("player_damage");
          lives--; updateHUD(); triggerFlash("#f44");
          if(lives>0){ player.invT=1200; player.x=160; player.y=Math.max(PLAYER_ZONE_TOP,H-24); regenMushrooms(); } else { player.invT = 2000; showGameOver(); return; }
          break;
        }
      }
    }

  // spiders: deterministic spawn, hunt player, bullet collision, player collision, cleanup
  spiderSpawnTimer++;
  if(spiderSpawnTimer >= SPIDER_SPAWN_INTERVAL && spiders.length < 4){
    spiderSpawnTimer = 0;
    var side = Math.random() < 0.5 ? -12 : W + 12;
    spiders.push({ x: side, y: rnd(20, H - 40), w: 14, h: 10, dirX: side < 0 ? 1 : -1 });
  }
  for(var si=spiders.length-1;si>=0;si--){
    var sp=spiders[si]; if(!sp) continue;
    // hunt player when in range, else drift toward center
    var hdx=player.x-sp.x, hdy=player.y-sp.y;
    var hdist=Math.sqrt(hdx*hdx+hdy*hdy);
    if(hdist < SPIDER_HUNT_RANGE){
      sp.dirX = hdx > 0 ? 1 : -1;
      sp.y += (hdy > 0 ? 1 : -1) * SPIDER_SPEED * 0.6;
    } else {
      // drift toward player y slowly
      if(player.y - sp.y > 4) sp.y += 0.5;
      else if(sp.y - player.y > 4) sp.y -= 0.5;
    }
    sp.x += sp.dirX * SPIDER_SPEED;
    // bullet hits spider -> score + remove
    for(var bi2=bullets.length-1;bi2>=0;bi2--){
      var b2=bullets[bi2]; if(!b2) continue;
      if(rectHit(b2,sp)){
        var spiderDist=Math.abs(player.y-sp.y);
        var spiderPts=spiderDist>=64?300:spiderDist>=22?600:900;
        bullets.splice(bi2,1); playSfx("spider_kill"); spiders.splice(si,1); score+=spiderPts; updateHUD(); spawnBurst(sp.x, sp.y, "#a7d", 6); spawnPopup(sp.x,sp.y,"+"+spiderPts,"#d6f"); break;
      }
    }
    // player hits spider -> lose life (respawn when lives remain, game over otherwise)
     if(rectHit(player,sp) && player.invT<=0){
       lives--; updateHUD(); triggerFlash("#f44");
       if(lives>0){ player.invT=1200; player.x=160; player.y=Math.max(PLAYER_ZONE_TOP,H-24); regenMushrooms(); } else { showGameOver(); return; }
     }

     // cleanup off-screen
    if(sp.x < -30 || sp.x > W+30) spiders.splice(si,1);
  }

  // fleas: deterministic spawn every 900 frames, capped at FLEA_MAX
  fleaSpawnTimer++;
  if(fleaSpawnTimer >= FLEA_SPAWN_INTERVAL && fleas.length < FLEA_MAX){
    fleaSpawnTimer = 0;
    fleas.push({ x: rnd(16,W-16), y: -12, w: 14, h: 8, killed: false });
  }
  for(var fi=fleas.length-1;fi>=0;fi--){
    var fl=fleas[fi]; if(!fl) continue;
    // move vertically downward
    fl.y += FLEA_SPEED;
    // when crossing a mushroom row, spawn a mushroom only if that grid slot is empty
    for(var fr=0;fr<MUSH_ROWS;fr++){
      var rowY = MUSH_OFF_Y + fr*MUSH_CH;
      if(fl.y >= rowY && fl.y < rowY + FLEA_SPEED + 2){
        for(var fc=0;fc<MUSH_COLS;fc++){
          var slotX = MUSH_OFF_X + fc*MUSH_CW;
          if(Math.abs(fl.x - slotX) < MUSH_CW/2 + 4){
            var occupied = false;
            for(var mi=0;mi<mush.length;mi++){
              if(mush[mi].gR===fr && mush[mi].gC===fc){occupied=true;break;}
            }
            if(!occupied){
              mush.push({
                x: slotX, y: rowY, w: 18, h: 14, stemH: 0,
                gR: fr, gC: fc, poisoned: false, pTimer: 0, hp: 4
              });
            }
            break;
          }
        }
      }
    }
    // bullet hits flea -> score + remove (once)
    for(var bfi=bullets.length-1;bfi>=0;bfi--){
      var bf=bullets[bfi]; if(!bf) continue;
      if(rectHit(bf,fl)){
        bullets.splice(bfi,1);
        playSfx("flea_kill");
        spawnBurst(fl.x, fl.y, "#fa5", 6);
        if(!fl.killed){ fl.killed = true; score += FLEA_SCORE; updateHUD(); spawnPopup(fl.x,fl.y,"+"+FLEA_SCORE,"#fa5"); }
        fleas.splice(fi,1); break;
      }
    }
    // player hits flea -> lose life with invincibility
    // player hits flea -> lose life (respawn when lives remain)
    if(rectHit(player,fl) && player.invT<=0){
      lives--; updateHUD(); triggerFlash("#f44");
      if(lives>0){ player.invT=1200; player.x=160; player.y=Math.max(PLAYER_ZONE_TOP,H-24); regenMushrooms(); } else { showGameOver(); return; }
    }
    // cleanup off-screen (bottom)
    if(fl.y > H+16) fleas.splice(fi,1);
  }

  // scorpions: deterministic spawn every 1200 frames during active play, capped at 1
  scorpionSpawnTimer++;
  if(scorpionSpawnTimer >= SCORPION_SPAWN_INTERVAL && running && !gameOver && scorpions.length < 1){
    scorpionSpawnTimer = 0;
    var side = Math.random() < 0.5 ? -12 : W + 12;
    scorpions.push({ x: side, y: rnd(30, H-40), w: 22, h: 14, dirX: side < 0 ? 1 : -1, killed: false });
  }
  for(var sci=scorpions.length-1;sci>=0;sci--){
    var sc=scorpions[sci]; if(!sc) continue;
    // horizontal movement across playfield
    sc.x += sc.dirX * SCORPION_SPEED;
    // poison mushrooms it crosses (set poisoned=true, reset pTimer)
    for(var mi2=mush.length-1;mi2>=0;mi2--){
      var mc=mush[mi2];
      if(Math.abs(sc.x - mc.x) < MUSH_CW && Math.abs(sc.y - mc.y) < MUSH_CH){
        mc.poisoned = true; mc.pTimer = 0;
      }
    }
    // bullet hits scorpion -> score + remove (once)
    for(var bsi=bullets.length-1;bsi>=0;bsi--){
      var bs2=bullets[bsi]; if(!bs2) continue;
      if(rectHit(bs2,sc)){
        bullets.splice(bsi,1);
        playSfx("scorpion_kill");
        spawnBurst(sc.x, sc.y, "#a7d", 6);
        if(!sc.killed){ sc.killed = true; score += SCORPION_SCORE; updateHUD(); spawnPopup(sc.x,sc.y,"+"+SCORPION_SCORE,"#d6f"); }
        scorpions.splice(sci,1); break;
      }
    }
    // player hits scorpion -> lose life (respawn when lives remain)
    if(rectHit(player,sc) && player.invT<=0){
      lives--; updateHUD(); triggerFlash("#f44");
      if(lives>0){ player.invT=1200; player.x=160; player.y=Math.max(PLAYER_ZONE_TOP,H-24); regenMushrooms(); } else { showGameOver(); return; }
    }
    // cleanup off-screen
    if(sc.x < -30 || sc.x > W+30) scorpions.splice(sci,1);
  }

  // check life loss -> game over or respawn
  if(lives <= 0){
    showGameOver();
    return;
  }

  // wave completion: all centipede segments destroyed and spawn queue empty
  if(centi.length === 0 && centiSpawned >= centiTarget && centiTarget > 0){
    // wave-clear bonus: authentic Centipede awards 10 pts per remaining mushroom
    var waveBonus = mush.length * 10;
    if(waveBonus > 0){ score += waveBonus; spawnPopup(W/2, H/2, "WAVE BONUS +" + waveBonus, "#0ff"); }
    playSfx("wave_transition");
    startNextWave();
  }

  updateHUD();
  updateFx();
  updatePopups();
}

// --- WAVE banner (centered on canvas for ~70 frames after wave++ ) ---
function drawWaveBanner(){
  if(waveBannerT<=0) return;
  ctx.save();
  var fade = Math.min(1, waveBannerT / 24);
  var isBonus=wave%5===0;
  var bCol=isBonus?"rgba(255,80,20,":"rgba(255,170,20,";
  ctx.fillStyle=bCol+fade+")";ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.font="bold "+(isBonus?18:16)+"px monospace";ctx.textAlign="center";
  ctx.fillStyle=isBonus?"#f84":"#ff9";
  ctx.fillText((isBonus?"BONUS ":"")+"WAVE "+wave,W/2,H/2);
  ctx.restore();
  ctx.restore();
}

// --- draw ---
function drawGame(){
  if(!running){drawAttract();return;}
  // neon dark green gradient background with radial vignette glow
  var grad = ctx.createRadialGradient(W/2,H*.75,W/4,H/2,H*1.1,Math.sqrt(W*W+H*H)*.6);
  grad.addColorStop(0,"rgba(10,40,20,.15)");grad.addColorStop(.5,"rgba(13,59,31,.8)");grad.addColorStop(1,"rgba(5,20,10,.95)");
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  // subtle neon grid lines
  ctx.strokeStyle="rgba(60,200,120,.08)"; ctx.lineWidth=.3;ctx.globalAlpha=.7;
  for(var gy=4;gy<H;gy+=4){var ly=W*gy/H;ctx.beginPath();ctx.moveTo(ly,0);ctx.lineTo(ly,H);ctx.stroke()}
  // player zone boundary glow
  var pzGrad = ctx.createLinearGradient(0,PLAYER_ZONE_TOP,0,H);
  pzGrad.addColorStop(0,"rgba(255,100,60,.4)");pzGrad.addColorStop(1,"rgba(255,50,30,.0)");
  ctx.strokeStyle=pzGrad;ctx.lineWidth=1.5;ctx.globalAlpha=.8;
  ctx.beginPath();ctx.moveTo(0,PLAYER_ZONE_TOP);ctx.lineTo(W,PLAYER_ZONE_TOP);ctx.stroke();
  ctx.globalAlpha=1;

  for(var m of mush){ drawMushroomSprite(m.x,m.y,m.w,m.h,m.hp,m.poisoned); }

  for(var c of centi){
    if(!c||!c.segments[0]) continue;
    for(var s of c.segments){ drawCentipedeSprite(s.x,s.y,s.w,s.h,false,c.dirX); }
  }
  for(var i=centi.length-1;i>=0;i--){
    var c=centi[i]; if(!c) continue; var s=c.segments[0]; if(!s) continue;
    drawCentipedeSprite(s.x,s.y,s.w,s.h,true,c.dirX);
  }

  for(var spi of spiders){ drawSpiderSprite(spi.x,spi.y,spi.w,spi.h,spi.dirX); }
  for(var fli of fleas){ drawFleaSprite(fli.x,fli.y,fli.w,fli.h); }
  for(var sci of scorpions){ drawScorpionSprite(sci.x,sci.y,sci.dirX); }

  // neon bullet glow trail
  for(var bi=bullets.length-1;bi>=0;bi--){var b=bullets[bi];if(!b)continue;
    var col=b.poisoned?"rgba(160,230,255,.9)":"rgba(255,180,80,.9)";
    ctx.globalAlpha=.4;ctx.fillStyle=col;ctx.beginPath();ctx.arc(b.x,b.y+1.5,5,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=b.poisoned?"#cde":"#f94"; ctx.beginPath();ctx.arc(b.x-2,b.y+.5,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff"; ctx.beginPath();ctx.arc(b.x+2,b.y-.5,1.5,0,Math.PI*2);ctx.fill()
  }

  drawPlayerSprite(player.x,player.y,player.invT);
  drawFx();
  drawFlash();
  drawWaveBanner();
  drawPopups();
}

// --- HUD with neon styling for portrait readability ---
function updateHUD(){
  if(score>=nextExtraLife && lives<6){ lives++; nextExtraLife+=12000; playSfx("extra_life"); spawnPopup(player.x,player.y-10,"1UP","#0f0"); }
  if(score>highScore){highScore=score;try{localStorage.setItem("cenitpede_hs",String(highScore))}catch(e){}}
  // neon HUD with glow for portrait readability
  hudSc.style.color="#fff";hudSc.style.textShadow="0 0 6px rgba(100,255,200,.8)";hudSc.textContent=score;
  hudLv.style.color="#ff4";hudLv.style.textShadow="0 0 4px rgba(255,200,60,.7)";hudLv.textContent=lives;
  hudWg.style.color="#fff";hudWg.style.textShadow="0 0 4px rgba(100,200,255,.6)";hudWg.textContent=wave;
  document.getElementById("hs").style.color="#ff9";document.getElementById("hs").textContent=highScore;
}
